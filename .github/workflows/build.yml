  build-docker-images-backend:
    name: Build BACKEND Docker Images per Platform
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is-release: ${{ needs.version.outputs.is-release }}
      tag: ${{ steps.meta.outputs.tag-names }}
      branch: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set cache name
        id: cache-name
        run: |
          echo "cache-name=${{ needs.version.outputs.version }}-backend-cache-${{ matrix.platform }}-${{ github.run_id }}" | sed 's:/:-:g' >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build Docker Image (${{ matrix.platform }})
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=local,dest=/tmp/${{ steps.cache-name.outputs.cache-name }},mode=max
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Upload cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.cache-name.outputs.cache-name }}
          path: /tmp/${{ steps.cache-name.outputs.cache-name }}
          retention-days: 1

  build-docker-images-web:
    name: Build WEB Docker Images per Platform
    runs-on: ubuntu-latest
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is-release: ${{ needs.version.outputs.is-release }}
      tag: ${{ steps.meta.outputs.tag-names }}
      branch: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set cache name
        id: cache-name
        run: |
          echo "cache-name=${{ needs.version.outputs.version }}-web-cache-${{ matrix.platform }}-${{ github.run_id }}" | sed 's:/:-:g' >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}

      - name: Build Docker Image (${{ matrix.platform }})
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=local,dest=/tmp/${{ steps.cache-name.outputs.cache-name }},mode=max
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Upload cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.cache-name.outputs.cache-name }}
          path: /tmp/${{ steps.cache-name.outputs.cache-name }}
          retention-days: 1

  push-docker-images:
    name: Push Multi-Platform Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [build-docker-images-backend, build-docker-images-web]
    outputs:
      api-digest: ${{ steps.push-api.outputs.digest }}
      web-digest: ${{ steps.push-web.outputs.digest }}
      version-api: ${{ needs.build-docker-images-backend.outputs.version }}
      version-web: ${{ needs.build-docker-images-web.outputs.version }}
      is-release-api: ${{ needs.build-docker-images-backend.outputs.is-release }}
      is-release-web: ${{ needs.build-docker-images-web.outputs.is-release }}
      branch: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for BACKEND image
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=${{ needs.build-docker-images-backend.outputs.version }}

      - name: Extract metadata for WEB image
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=raw,value=${{ needs.build-docker-images-web.outputs.version }}

      - name: Download BACKEND cache artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/cache-backend
          pattern: "*-backend-cache-*"
          merge-multiple: true

      - name: Download WEB cache artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/cache-web
          pattern: "*-web-cache-*"
          merge-multiple: true

      - name: Build and push multi-platform BACKEND image
        id: push-backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=local,src=/tmp/cache-backend
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT=${{ github.sha }}

      - name: Build and push multi-platform WEB image
        id: push-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=local,src=/tmp/cache-web
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT=${{ github.sha }}

