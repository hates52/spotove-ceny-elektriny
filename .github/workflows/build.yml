name: Build and Release

on:
  #push:
  #  branches:
  #    - main
  #  tags:
  #    - "v*.*.*"
  #  paths-ignore:
  #    - "README.md"
  #    - "docs/**"
  #    - ".github/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g., v1.2.3). If empty, derived from branch/commits."
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/spotove-ceny-elektriny/backend
  IMAGE_NAME_WEB: ${{ github.repository_owner }}/spotove-ceny-elektriny/web
  NODE_VERSION: "26"
  # Platforms for Go cross-compilation
  PLATFORMS: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64

jobs:
  verify-backend:
    name: Verify Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        working-directory: packages/backend
        run: npm run lint

      - name: Type-check backend
        working-directory: packages/backend
        run: npm run type-check

      - name: Security audit
        run: npm run security --workspace=@spotove-ceny-elektriny/backend

      # - name: Run backend tests
      #   run: npm test --workspace=@spotove-ceny-elektriny/backend

  verify-web-app:
    name: Verify Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint web-app
        working-directory: packages/web-app
        run: npx eslint --max-warnings=0 .

      - name: Security audit
        run: npm run security --workspace=@spotove-ceny-elektriny/web-app

      # - name: Run web-app tests
      #   run: npm test --workspace=@spotove-ceny-elektriny/web-app

  version:
    name: Determine Version
    runs-on: ubuntu-latest
    needs: [verify-backend, verify-web-app]
    if: needs.verify-backend.result == 'success' && needs.verify-web-app.result == 'success'
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      is-release: ${{ steps.set-version.outputs.is-release }}
      tag: ${{ steps.set-version.outputs.tag }}
      branch: ${{ steps.set-version.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and release info
        id: set-version
        run: |
          BRANCH="${{ github.ref_name }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$BRANCH" == "main" ]]; then
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          else
            VERSION="dev-$(echo $BRANCH | sed 's/[^a-zA-Z0-9]/-/g')-$(git rev-parse --short HEAD)"
          fi

          IS_RELEASE="false"
          TAG=""
          if [[ "$BRANCH" == "main" && -n "$INPUT_VERSION" && "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            IS_RELEASE="true"
            TAG="$INPUT_VERSION"
          fi

          # For non-release builds use 0.0.0-{short.sha} as the version
          if [[ "$IS_RELEASE" != "true" ]]; then
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

