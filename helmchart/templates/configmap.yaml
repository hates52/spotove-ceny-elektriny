apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spotova-cena-elektriny.fullname" . }}-config
  labels:
    {{- include "spotova-cena-elektriny.labels" . | nindent 4 }}
data:
  # Backend config
  {{- range $key, $value := .Values.config.backend }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  # Web-app config
  {{- range $key, $value := .Values.config.web }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.oidc }}
  {{- $tenantId := .Values.config.oidc.AZURE_TENANT_ID }}
  {{- if $tenantId }}
  # OIDC derived values (shared)
  AZURE_TENANT_ID: {{ $tenantId | quote }}
  OIDC_AUTHORITY: {{ printf "https://login.microsoftonline.com/%s/v2.0" $tenantId | quote }}
  OIDC_ISSUER: {{ printf "https://login.microsoftonline.com/%s/v2.0" $tenantId | quote }}
  OIDC_JWKS_URL: {{ printf "https://login.microsoftonline.com/%s/discovery/v2.0/keys" $tenantId | quote }}
  {{- end }}
  {{- if .Values.config.oidc.OIDC_CLIENT_ID }}
  OIDC_CLIENT_ID: {{ .Values.config.oidc.OIDC_CLIENT_ID | quote }}
  {{- end }}
  {{- if .Values.config.oidc.OIDC_SCOPE }}
  OIDC_SCOPE: {{ .Values.config.oidc.OIDC_SCOPE | quote }}
  {{- end }}
  {{- if .Values.config.oidc.OIDC_AUDIENCE }}
  OIDC_AUDIENCE: {{ .Values.config.oidc.OIDC_AUDIENCE | quote }}
  {{- end }}
  {{- if .Values.config.oidc.OIDC_REQUIRED_GROUP }}
  OIDC_REQUIRED_GROUP: {{ .Values.config.oidc.OIDC_REQUIRED_GROUP | quote }}
  {{- end }}
  {{- end }}