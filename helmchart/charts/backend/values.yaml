# Default values for backend subchart

replicaCount: 1

image:
  repository: ghcr.io/hates52/spotove-ceny-elektriny/backend
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 4000

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# TLS configuration (cert-manager)
tls:
  enabled: false
  # Secret name for TLS certificate (auto-generated by cert-manager)
  secretName: ""
  # Issuer/ClusterIssuer for cert-manager
  certManager:
    issuerRef:
      name: ""
      kind: ClusterIssuer
  # Mount path for TLS certificates inside container
  mountPath: "/etc/tls"

# Ingress configuration for backend API
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# HTTPRoute configuration (Gateway API) for backend API
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - api.chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /