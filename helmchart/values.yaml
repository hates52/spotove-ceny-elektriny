# Default values for spotove-ceny-elektriny
# This is a YAML-formatted file.

# Global settings
nameOverride: ""
fullnameOverride: ""

# Global pod settings (shared by all subcharts)
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
image:
  tag: ""
  pullPolicy: IfNotPresent

# Backend subchart configuration
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/hates52/spotove-ceny-elektriny/backend
    pullPolicy: IfNotPresent
    tag: ""
  extraEnv: []
  service:
    type: ClusterIP
    port: 4000
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  # TLS configuration (cert-manager)
  tls:
    enabled: false
    # Secret name for TLS certificate (auto-generated by cert-manager)
    secretName: ""
    # Issuer/ClusterIssuer for cert-manager
    certManager:
      issuerRef:
        name: ""
        kind: ClusterIssuer
    # Mount path for TLS certificates inside container
    mountPath: "/etc/tls"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: api.chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - api.chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Web subchart configuration
web:
  replicaCount: 1
  image:
    repository: ghcr.io/hates52/spotove-ceny-elektriny/web
    pullPolicy: IfNotPresent
    tag: ""
  extraEnv: []
  service:
    type: ClusterIP
    port: 3000
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs:
      - name: gateway
        sectionName: http
    hostnames:
      - chart-example.local
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

# Shared configuration (passed to subcharts)
config:
  backend:
    PORT: "4000"
    DATA_DIR: "/app/data"
    CRON_SCHEDULE: "*/15 * * * *"
    DATA_SOURCE: "ote"
  web:
    BACKEND_URL: "https://spotove-ceny-elektriny-backend:4000"
    INSECURE_TLS: "false"

  # OIDC configuration
  oidc:
    # Azure AD Tenant ID (shared by backend and web)
    AZURE_TENANT_ID: "e0690ba2-036d-442a-84ee-e87b1e442964"
    # Web app - user authentication
    OIDC_CLIENT_ID: "e65de300-3a2d-4404-8a7c-d893d755aa8f"
    OIDC_SCOPE: "openid profile email api://27a8c0db-80aa-48e3-a777-9ccd30f23a7b/.default"
    # Backend - token validation
    OIDC_AUDIENCE: "api://27a8c0db-80aa-48e3-a777-9ccd30f23a7b"
    OIDC_REQUIRED_GROUP: "f5c420d7-92c7-48b9-aac2-df465fe149bb"
